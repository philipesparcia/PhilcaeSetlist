<style>
  :root{
    --bg:#0d0f12; --panel:#14171c; --panel2:#1c2027; --line:#262b34;
    --text:#eceef2; --mute:#8b93a3; --accent:#e9b04c; --accent2:#4fc3a1; --danger:#f2787b;
    --lyric:#d3d7de; --hover:#232832; --shadow:0 10px 30px -12px rgba(0,0,0,.7);
    --size:22px; --onaccent:#1a1200; --onaccent2:#04251a;
  }
  :root[data-theme=light]{
    --bg:#f6f4ef; --panel:#ffffff; --panel2:#eeebe4; --line:#d9d5cb;
    --text:#1f2328; --mute:#6b7280; --accent:#b45309; --accent2:#047857; --danger:#c62828;
    --onaccent:#ffffff; --onaccent2:#ffffff; --lyric:#2b3038; --hover:#e6e2d9; --shadow:0 10px 30px -14px rgba(60,50,30,.25);
  }
  :root[data-theme=light] button:hover{border-color:#b9b4a8}
  :root[data-theme=light] #modal{background:rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;display:flex;overflow:hidden}
  button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
  button:hover{border-color:#454c59}
  button.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
  button.danger{color:var(--danger)}
  button.small{padding:4px 8px;font-size:13px}
  button.ghost{background:transparent;border-color:transparent;color:var(--mute)}
  button.ghost:hover{color:var(--text)}
  input,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}

  /* sidebar */
  #side{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
  #side header{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
  #side h1{font-size:17px;margin:0;letter-spacing:.02em}
  #sets{overflow:auto;flex:1;padding:8px 8px 24px}
  .set{margin-bottom:14px}
  .sethead{display:flex;gap:4px;align-items:center;padding:4px}
  .sethead input{flex:1;min-width:0;background:transparent;border-color:transparent;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-size:13px;padding:6px}
  .sethead input:hover{border-color:var(--line)}
  .song{display:flex;align-items:center;gap:2px;border-radius:8px;padding:2px 4px 2px 8px;cursor:pointer}
  .song:hover{background:var(--panel2)}
  .song.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .song .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 0}
  .song .n{color:var(--mute);font-size:12px;width:20px}
  .song .mv{opacity:0;display:flex}
  .song:hover .mv,.song.active .mv{opacity:1}
  .addsong{margin:4px 4px 0;width:calc(100% - 8px);border-style:dashed;color:var(--mute);background:transparent}
  #side footer{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  #side footer button{flex:1}

  /* main */
  #main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
  #bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  #menu{display:none}
  #title{flex:1 1 200px;min-width:120px;font-size:18px;font-weight:700;background:transparent;border-color:transparent}
  #title:hover{border-color:var(--line)}
  .grp{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
  .grp b{color:var(--text);min-width:28px;text-align:center;font-family:'JetBrains Mono',monospace}
  input[type=range]{padding:0;accent-color:var(--accent);width:120px}
  #play{min-width:112px;font-weight:700}
  #play.on{background:var(--accent2);border-color:var(--accent2);color:var(--onaccent2)}

  #stage{flex:1;overflow:auto;position:relative;scroll-behavior:auto;touch-action:pan-x pan-y}
  #sheet{max-width:none;margin:0 auto;padding:28px 28px 70vh;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:var(--size);line-height:1.55;white-space:pre;overflow-wrap:normal;width:max-content;min-width:0}
  #sheet .c{color:var(--accent);font-weight:700}
  #sheet .s{color:var(--accent2);font-weight:700;margin-top:.7em;display:block}
  #sheet .l{color:var(--lyric)}
  #sheet .ln{display:block;min-height:1.55em}
  #sheet .sep{width:var(--sepw,100%);display:flex;align-items:center;gap:14px;margin:2.2em 0 1em;font-family:'DM Sans',system-ui,sans-serif;white-space:normal}
  #sheet .sep:first-child{margin-top:0}
  #sheet .sep::before,#sheet .sep::after{content:'';height:2px;background:var(--line);flex:1}
  #sheet .sep .pill{background:var(--accent);color:var(--onaccent);font-weight:700;border-radius:999px;padding:6px 16px;font-size:.62em;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
  #sheet .sep .nm{font-weight:700;font-size:.9em;text-align:center;max-width:70%}
  #sheet .sep .box2{display:flex;flex-direction:column;align-items:center;gap:6px}
  #sheet .sep .st{color:var(--mute);font-size:.5em;letter-spacing:.08em;text-transform:uppercase}
  #sheet .none{color:var(--mute);font-style:italic}
  body.setview #title,body.setview .grp.tr{display:none}
  #crumb{display:none;flex:1 1 200px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-size:14px}
  body.setview #crumb{display:block}

  #editwrap{display:none;flex-direction:column;flex:1;padding:14px;gap:10px;min-height:0}
  #text{flex:1;resize:none;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15px;line-height:1.5;white-space:pre}
  .hint{color:var(--mute);font-size:13px}
  .empty{margin:12vh auto;text-align:center;color:var(--mute);max-width:360px;padding:0 20px}

  /* overlay for restore */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  #modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px}
  #modal textarea{height:200px;font-family:'JetBrains Mono',monospace;font-size:12px}
  #modal .row{display:flex;gap:8px;justify-content:flex-end}

  #scrim{display:none}
  @media (max-width:800px){
    #side{position:fixed;z-index:15;left:0;top:0;transform:translateX(-100%);transition:transform .2s;width:min(320px,88vw)}
    body.open #side{transform:none}
    body.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:14}
    #menu{display:inline-block}
    #sheet{padding:18px 14px 70vh}
    input[type=range]{width:90px}
  }

  /* ---- polish ---- */
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{transition:background .15s,border-color .15s,color .15s,transform .05s;border-color:var(--line)}
  button:hover{background:var(--hover)}
  button:active{transform:translateY(1px)}
  button.primary:hover{background:var(--accent);filter:brightness(1.08)}
  button.ghost:hover{background:var(--hover)}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #side{box-shadow:var(--shadow)}
  #side header{padding:18px 16px}
  #side h1{font-size:16px;font-weight:700;letter-spacing:.01em}
  .sethead input{font-size:12px;letter-spacing:.12em;color:var(--accent)}
  .song{border-radius:10px;transition:background .15s}
  .song.active{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent 85%),var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .song .n{font-family:'JetBrains Mono',monospace;font-size:11px}
  .addsong{border-color:var(--line);border-radius:10px}
  .addsong:hover{color:var(--text);border-color:var(--mute)}
  #bar{background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line),var(--shadow);position:relative;z-index:5;padding:12px 18px}
  #title{font-size:19px;letter-spacing:.005em}
  .grp{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px 6px;gap:4px}
  .grp .small{border:none;background:transparent;padding:4px 9px;font-size:15px}
  .grp .small:hover{background:var(--hover)}
  .grp b{color:var(--text)}
  #play{background:var(--accent);border-color:var(--accent);color:var(--onaccent);box-shadow:0 6px 18px -8px var(--accent)}
  #play:hover{background:var(--accent);filter:brightness(1.08)}
  #play.on{background:var(--accent2);border-color:var(--accent2);color:var(--onaccent2);box-shadow:0 6px 18px -8px var(--accent2)}
  #stage{background:var(--bg)}
  #sheet{line-height:1.6}
  #sheet .c{letter-spacing:.01em}
  #sheet .sep::before,#sheet .sep::after{background:linear-gradient(90deg,transparent,var(--line))}
  #sheet .sep::after{background:linear-gradient(270deg,transparent,var(--line))}
  #sheet .sep .pill{box-shadow:0 6px 16px -8px var(--accent)}
  input,textarea{background:var(--bg);border-color:var(--line)}
  #text{background:var(--panel);border-radius:12px;padding:16px}
  #modal .box{box-shadow:var(--shadow);border-radius:16px}
  *{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--mute);background-clip:padding-box;border:2px solid transparent}

  #gigbar{padding:12px 14px;border-bottom:1px solid var(--line)}
  #gigbar .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px;font-weight:700}
  .gigrow{display:flex;gap:6px;align-items:center}
  #gigSel,#gigName{flex:1;min-width:0;font:inherit;font-weight:700;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  #gigSel{appearance:auto}
  #gigbar button.danger{color:var(--danger)}

  .song{position:relative}
  .song .grab{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--mute);opacity:.55;padding:8px 4px 8px 0;font-size:16px;line-height:1}
  .song:hover .grab,.song.active .grab{opacity:1}
  .song.dragging{opacity:.35}
  .song.ghost{position:fixed;z-index:40;pointer-events:none;background:var(--panel2);border:1px solid var(--accent);box-shadow:var(--shadow);opacity:.97;margin:0}
  .song.ghost .mv{display:none}
  .song.drop-before::before,.song.drop-after::after{content:'';position:absolute;left:4px;right:4px;height:3px;background:var(--accent);border-radius:3px;z-index:2}
  .song.drop-before::before{top:-2px}
  .song.drop-after::after{bottom:-2px}
  .addsong.drop-end{border-color:var(--accent);color:var(--accent);border-style:solid}


  a.btn{display:inline-block;text-decoration:none;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
  a.btn:hover{background:var(--hover)}
  a.btn.small{padding:7px 11px;font-size:13px}
  .findpanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .findlbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
  .findrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .findrow input{flex:1 1 180px;min-width:0}
  body.setview #findG{display:none}

  #fVal{min-width:34px}
  #fitBtn.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}

  .scanrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .scanrow .findlbl{margin-right:auto}
</style>
</head>
<body>

<aside id="side">
  <header>
    <h1>🎸 Phi'Cae Setlist</h1>
    <button class="primary small" id="addSet">+ New set</button>
  </header>
  <div id="gigbar">
    <div class="lbl">Gig</div>
    <div class="gigrow">
      <select id="gigSel" aria-label="Choose gig"></select>
      <input id="gigName" aria-label="Gig name" style="display:none">
      <button class="small" id="gigAdd" title="New gig">＋</button>
      <button class="small" id="gigEdit" title="Rename gig">✎</button>
      <button class="small" id="gigDel" title="Delete gig">✕</button>
    </div>
  </div>
  <div id="sets"></div>
  <footer>
    <button class="small" id="backup">Backup</button>
    <button class="small" id="restore">Restore</button>
  </footer>
</aside>
<div id="scrim"></div>

<section id="main">
  <div id="bar">
    <button id="menu" title="Sets and songs">☰</button>
    <input id="title" placeholder="Song title" aria-label="Song title">
    <div id="crumb"></div>
    <div class="grp tr" title="Transpose"><button class="small" id="tDown">−</button><b id="tVal">0</b><button class="small" id="tUp">+</button><span>key</span></div>
    <div class="grp" title="Zoom (you can also pinch with two fingers)"><button class="small" id="fDown">A−</button><b id="fVal">22</b><button class="small" id="fUp">A+</button><button class="small" id="fitBtn" title="Fit the longest line to the screen">Fit</button></div>
    <div class="grp" title="Autoscroll speed"><span>Slow</span><button class="small" id="spDown">−</button><b id="spVal">8</b><button class="small" id="spUp">+</button><span>Fast</span></div>
    <button id="findG" title="Search for this song's chords online">🔍 Find chords</button>
    <button id="viewBtn" title="Show every song in this set, in order">☷ Whole set</button>
    <button id="play">▶ Autoscroll</button>
    <button id="themeBtn" title="Switch light / dark">☀ Light</button>
    <button id="editBtn">✎ Edit chords</button>
  </div>

  <div id="stage"><div id="sheet"></div></div>

  <div id="editwrap">
    <div class="hint">Paste your chords and lyrics below, then press <b>Done</b>. Chord lines (like <code>G  D  Em  C</code>) are highlighted automatically.</div>
    <div class="findpanel" style="gap:6px">
      <div class="findlbl">✎ Song title</div>
      <input id="title2" placeholder="Song title" aria-label="Song title" style="font-weight:700;font-size:17px">
    </div>
    <div class="findpanel">
      <div class="findlbl">🔍 Search chords online</div>
      <div class="findrow">
        <input id="findQ" placeholder="Type a song to search, then tap a button" aria-label="Search term">
        <a class="btn small" id="findG2" target="_blank" rel="noopener noreferrer">🔍 Google</a>
        <a class="btn small" id="findUG" target="_blank" rel="noopener noreferrer">🎸 Ultimate Guitar</a>
      </div>
    </div>
    <div class="scanrow">
      <div class="findlbl">✎ Chords and lyrics</div>
      <button class="small" id="cleanBtn" title="Remove website header/footer from pasted text">🧹 Clean up</button>
      <button class="small" id="scanBtn" title="Read chords and lyrics from a photo or screenshot">📷 Scan photo</button>
      <input type="file" id="scanFile" accept="image/*" multiple style="display:none">
      <span class="hint" id="scanStatus"></span>
    </div>
    <textarea id="text" spellcheck="false" placeholder="[Verse 1]&#10;G        D&#10;Paste your chords here..."></textarea>
    <div style="display:flex;gap:8px;justify-content:space-between">
      <button class="danger" id="delSong">Delete song</button>
      <button class="primary" id="done">Done</button>
    </div>
  </div>
</section>

<div id="modal"><div class="box">
  <b id="mTitle"></b><div class="hint" id="mHint"></div>
  <textarea id="mText" spellcheck="false"></textarea>
  <div id="mExtra" class="row" style="justify-content:flex-start;flex-wrap:wrap"></div>
  <input type="file" id="restoreFile" style="display:none">
  <div class="row"><button id="mClose">Close</button><button class="primary" id="mAction"></button></div>
</div></div>

<script>
(function(){
  const KEY='setlist-chords-v1';
  const uid=()=>Math.random().toString(36).slice(2,9);
  const $=id=>document.getElementById(id);

  let S=load();
  function defaults(){
    const s1=uid(), g=uid();
    const gid=uid();
    return {gigs:[{id:gid,name:'Gig 1',sets:[{id:s1,name:'First Set',songs:[{id:g,title:'Sample Song',transpose:0,
      text:"[Verse]\nG            D\nPaste your own chords here\nEm           C\nand press play to autoscroll\n\n[Chorus]\nC     G     D\nLa la la, sing along\n"}]}]}],
      gig:gid, cur:g, speed:8, size:22};
  }
  function migrate(o){
    if(o&&Array.isArray(o.sets)&&!Array.isArray(o.gigs)){ const gid=uid(); o.gigs=[{id:gid,name:'Gig 1',sets:o.sets}]; o.gig=gid; delete o.sets; }
    if(!o||!Array.isArray(o.gigs)||!o.gigs.length) return null;
    if(!o.gigs.some(g=>g.id===o.gig)) o.gig=o.gigs[0].id;
    return o;
  }
  function load(){
    try{const r=localStorage.getItem(KEY); if(r){const o=migrate(JSON.parse(r)); if(o) return o;}}catch(e){}
    return defaults();
  }
  const curGig=()=>S.gigs.find(g=>g.id===S.gig)||S.gigs[0];
  const SETS=()=>curGig().sets;
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

  function findSong(id){
    for(const st of SETS()){const i=st.songs.findIndex(x=>x.id===id); if(i>-1) return {set:st,song:st.songs[i],i};}
    return null;
  }
  const cur=()=>findSong(S.cur);

  /* ---------- chord helpers ---------- */
  const NOTES_S=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const NOTES_F=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  const CH=/^\(?[A-G][#b]?(?:maj|min|dim|aug|sus|add|m|M|\+|°|ø|-)?(?:(?:sus|add|maj|dim|aug|b|#|-|\+)?\d+)*(?:sus)?(?:\/[A-G][#b]?)?\)?$/;
  const SEP=/^(?:[|:\-–—/\\]+|x\d+|\d+x|N\.?C\.?|\.{2,}|~+|%|\(?x?\d+\)?)$/i;
  function isChordLine(line){
    const t=line.trim().split(/\s+/).filter(Boolean);
    if(!t.length) return false;
    let n=0;
    for(const w of t){ if(CH.test(w)) n++; else if(!SEP.test(w)) return false; }
    return n>0;
  }
  const isSection=l=>/^\s*(\[.*\]|\(.*\)|(intro|verse|chorus|pre-?chorus|bridge|outro|solo|interlude|refrain|tag|instrumental|hook)\b.*:?\s*)$/i.test(l) && !isChordLine(l);

  function shiftNote(n,by,useFlat){
    let i=NOTES_S.indexOf(n); if(i<0) i=NOTES_F.indexOf(n);
    if(i<0) return n;
    i=((i+by)%12+12)%12;
    return (useFlat?NOTES_F:NOTES_S)[i];
  }
  function transposeLine(line,by){
    if(!by) return line;
    const useFlat = by<0;
    return line.replace(/\S+/g,tok=>{
      if(!CH.test(tok)) return tok;
      return tok.replace(/[A-G][#b]?/g,(m,off)=>{
        // only roots: at start (after optional paren) or after slash
        const prev=tok[off-1];
        if(off===0||prev==='('||prev==='/') return shiftNote(m,by,useFlat);
        return m;
      });
    });
  }

  /* ---------- drag to reorder (mouse + touch) ---------- */
  let drag=null;
  function clearMarks(){ document.querySelectorAll('.drop-before,.drop-after,.drop-end').forEach(el=>el.classList.remove('drop-before','drop-after','drop-end')); }
  function startDrag(e,id,row){
    if(e.button!==undefined&&e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    const r=row.getBoundingClientRect();
    const ghost=row.cloneNode(true); ghost.classList.add('ghost');
    ghost.style.width=r.width+'px'; ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
    document.body.append(ghost);
    row.classList.add('dragging');
    drag={id,row,ghost,offY:e.clientY-r.top,drop:null,pid:e.pointerId};
    try{ e.target.setPointerCapture(e.pointerId); }catch(_){}
    window.addEventListener('pointermove',moveDrag);
    window.addEventListener('pointerup',endDrag);
    window.addEventListener('pointercancel',cancelDrag);
  }
  function moveDrag(e){
    if(!drag) return;
    e.preventDefault();
    drag.ghost.style.top=(e.clientY-drag.offY)+'px';
    // auto-scroll the list near its edges
    const box=$('sets'), br=box.getBoundingClientRect();
    if(e.clientY<br.top+50) box.scrollTop-=12; else if(e.clientY>br.bottom-50) box.scrollTop+=12;
    clearMarks(); drag.drop=null;
    const el=document.elementFromPoint(e.clientX,e.clientY); if(!el) return;
    const row=el.closest('.song');
    if(row&&row.dataset.song!==drag.id){
      const rr=row.getBoundingClientRect(), after=e.clientY>rr.top+rr.height/2;
      row.classList.add(after?'drop-after':'drop-before');
      drag.drop={setId:row.closest('.set').dataset.set,refId:row.dataset.song,after};
      return;
    }
    if(row) return; // hovering over itself
    const set=el.closest('.set');
    if(set){ const a=set.querySelector('.addsong'); if(a) a.classList.add('drop-end'); drag.drop={setId:set.dataset.set,refId:null,after:false}; }
  }
  function finishDrag(){
    window.removeEventListener('pointermove',moveDrag);
    window.removeEventListener('pointerup',endDrag);
    window.removeEventListener('pointercancel',cancelDrag);
    clearMarks();
    if(drag){ drag.ghost.remove(); drag.row.classList.remove('dragging'); }
  }
  function cancelDrag(){ finishDrag(); drag=null; }
  function endDrag(){
    const d=drag; finishDrag(); drag=null;
    if(!d||!d.drop) return;
    const from=findSong(d.id); if(!from) return;
    const target=SETS().find(x=>x.id===d.drop.setId); if(!target) return;
    const song=from.set.songs.splice(from.i,1)[0];
    let idx=target.songs.length;
    if(d.drop.refId){ const j=target.songs.findIndex(x=>x.id===d.drop.refId); idx=j<0?target.songs.length:(d.drop.after?j+1:j); }
    target.songs.splice(idx,0,song);
    stopScroll(); save(); renderSide(); renderSheet(); renderBar();
  }

  /* ---------- gigs ---------- */
  function renderGigs(){
    const sel=$('gigSel'); sel.innerHTML='';
    S.gigs.forEach(g=>{ const o=document.createElement('option'); o.value=g.id; o.textContent=g.name||'Untitled gig'; if(g.id===S.gig) o.selected=true; sel.append(o); });
  }
  function switchGig(id){
    stopScroll(); setEdit(false);
    const old=curGig(); if(old) old.cur=S.cur;
    S.gig=id; const g=curGig();
    S.cur=g.cur&&findSong(g.cur)?g.cur:null; ensureCur();
    save(); renderAll(); stage.scrollTop=0; pos=0; lastSet=0;
  }
  function endRename(){
    if($('gigName').style.display==='none') return;
    const v=$('gigName').value.trim(); if(v) curGig().name=v;
    $('gigName').style.display='none'; $('gigSel').style.display='';
    save(); renderGigs(); renderSheet(); renderBar();
  }
  $('gigSel').onchange=e=>switchGig(e.target.value);
  $('gigAdd').onclick=()=>{
    const g={id:uid(),name:'Gig '+(S.gigs.length+1),sets:[{id:uid(),name:'First Set',songs:[]}]};
    S.gigs.push(g); switchGig(g.id); $('gigEdit').click();
  };
  $('gigEdit').onclick=()=>{
    $('gigSel').style.display='none'; const i=$('gigName'); i.style.display=''; i.value=curGig().name; i.focus(); i.select();
  };
  $('gigName').onblur=endRename;
  $('gigName').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); endRename(); } };
  let gigArm=0;
  $('gigDel').onclick=()=>{
    const b=$('gigDel');
    if(!gigArm){ gigArm=1; b.textContent='Sure?'; b.classList.add('danger'); setTimeout(()=>{gigArm=0; b.textContent='✕'; b.classList.remove('danger');},2500); return; }
    gigArm=0; b.textContent='✕'; b.classList.remove('danger');
    stopScroll(); setEdit(false);
    const i=S.gigs.findIndex(g=>g.id===S.gig); S.gigs.splice(i,1);
    if(!S.gigs.length) S.gigs.push({id:uid(),name:'Gig 1',sets:[{id:uid(),name:'First Set',songs:[]}]});
    S.gig=S.gigs[Math.min(i,S.gigs.length-1)].id; S.cur=null; ensureCur(); save(); renderAll(); stage.scrollTop=0; pos=0; lastSet=0;
  };

  /* ---------- sidebar ---------- */
  function renderSide(){
    renderGigs();
    const box=$('sets'); box.innerHTML='';
    SETS().forEach((st,si)=>{
      const wrap=document.createElement('div'); wrap.className='set'; wrap.dataset.set=st.id;
      const head=document.createElement('div'); head.className='sethead';
      const inp=document.createElement('input'); inp.value=st.name; inp.setAttribute('aria-label','Set name');
      inp.oninput=()=>{st.name=inp.value; save();};
      const up=mk('▲','ghost small',()=>moveSet(si,-1)); const dn=mk('▼','ghost small',()=>moveSet(si,1));
      const del=mk('✕','ghost small',()=>{
        if(del.dataset.arm){ SETS().splice(si,1); if(!SETS().length) SETS().push({id:uid(),name:'First Set',songs:[]}); ensureCur(); commit(); }
        else{ del.dataset.arm=1; del.textContent='Delete?'; del.classList.add('danger'); setTimeout(()=>{ if(del.isConnected){delete del.dataset.arm; del.textContent='✕'; del.classList.remove('danger');}},2500); }
      });
      del.title='Delete set';
      head.append(inp,up,dn,del); wrap.append(head);
      st.songs.forEach((sg,i)=>{
        const row=document.createElement('div'); row.className='song'+(sg.id===S.cur?' active':'');
        const n=document.createElement('span'); n.className='n'; n.textContent=i+1;
        const t=document.createElement('span'); t.className='t'; t.textContent=sg.title||'Untitled';
        const mv=document.createElement('span'); mv.className='mv';
        mv.append(mk('▲','ghost small',e=>{e.stopPropagation();moveSong(st,i,-1);}),mk('▼','ghost small',e=>{e.stopPropagation();moveSong(st,i,1);}));
        const sd=mk('✕','ghost small',e=>{
          e.stopPropagation();
          if(sd.dataset.arm){ st.songs.splice(i,1); stopScroll(); ensureCur(); setEdit(false); commit(); }
          else{ sd.dataset.arm=1; sd.textContent='Delete?'; sd.classList.add('danger'); setTimeout(()=>{ if(sd.isConnected){delete sd.dataset.arm; sd.textContent='✕'; sd.classList.remove('danger');}},2500); }
        });
        sd.title='Remove song'; mv.append(sd);
        const gr=document.createElement('span'); gr.className='grab'; gr.textContent='⠿'; gr.title='Drag to reorder'; gr.setAttribute('aria-label','Drag to reorder');
        gr.onclick=e=>e.stopPropagation();
        gr.addEventListener('pointerdown',e=>startDrag(e,sg.id,row));
        row.dataset.song=sg.id;
        row.append(gr,n,t,mv);
        row.onclick=()=>{ stopScroll(); S.cur=sg.id; setEdit(false); save(); renderAll(); document.body.classList.remove('open'); goCur(); };
        wrap.append(row);
      });
      const add=mk('+ Add song','addsong',()=>{ /*click*/
        const sg={id:uid(),title:'',text:'',transpose:0}; st.songs.push(sg); S.cur=sg.id; save(); renderAll(); setEdit(true); $('title').focus(); document.body.classList.remove('open');
      });
      wrap.append(add);
      box.append(wrap);
    });
  }

  /* ---------- clean up text pasted from a chord website ---------- */
  function cleanTabText(raw){
    const lines=raw.replace(/\r/g,'').split('\n');
    let start=lines.findIndex(l=>/^\s*\[[^\]]+\]/.test(l));
    if(start<0) start=lines.findIndex(l=>isChordLine(l)&&l.trim().split(/\s+/).length>=2);
    if(start<0) start=0;
    const head=lines.slice(0,start);
    let body=lines.slice(start);
    const foot=/^\s*(please rate this tab|related tabs|versions\s*$|what do you think about this tab|all artists\s*$|add to favorites|submit correction|rating\s*:)/i;
    const end=body.findIndex(l=>foot.test(l));
    if(end>=0) body=body.slice(0,end);
    body=body.map(l=>l.replace(/\s+$/,''));
    while(body.length&&(!body[body.length-1]||/^[A-Za-z]$/.test(body[body.length-1].trim())&&!isChordLine(body[body.length-1]))) body.pop();
    let out=body.join('\n').replace(/\n{3,}/g,'\n\n');
    const capo=head.find(l=>/^\s*capo\s*:/i.test(l));
    if(capo) out=capo.trim()+'\n\n'+out;
    let title='';
    for(const l of head){ const m=l.match(/^\s*(.+?)\s+(?:chords|tabs?|ukulele)\s+by\s+/i); if(m){ title=m[1].trim(); break; } }
    return {text:out,title,changed:start>0||end>=0};
  }

  /* ---------- scan a photo (OCR in the browser) ---------- */
  const norm=l=>l.replace(/\s+/g,' ').trim();
  function median(a){ if(!a.length) return 0; const b=[...a].sort((x,y)=>x-y); return b[Math.floor(b.length/2)]; }
  // Rebuild monospace text from OCR words using where each word sits in the picture
  function layoutLines(lines){
    lines=lines.filter(l=>l.words&&l.words.length).map(l=>({
      words:l.words.filter(w=>w.text&&w.text.trim()).map(w=>({t:w.text.trim(),x0:w.bbox.x0,x1:w.bbox.x1})),
      y0:l.bbox.y0,y1:l.bbox.y1
    })).filter(l=>l.words.length).sort((a,b)=>a.y0-b.y0);
    if(!lines.length) return [];
    const cws=[]; lines.forEach(l=>l.words.forEach(w=>{ if(w.t.length>=3) cws.push((w.x1-w.x0)/w.t.length); }));
    const cw=median(cws)||10;
    const minX=Math.min(...lines.map(l=>Math.min(...l.words.map(w=>w.x0))));
    const diffs=[]; for(let i=1;i<lines.length;i++) diffs.push(lines[i].y0-lines[i-1].y0);
    const pitch=median(diffs.filter(d=>d>0))||(lines[0].y1-lines[0].y0)*1.3;
    const out=[];
    lines.forEach((l,i)=>{
      if(i>0){ const gap=l.y0-lines[i-1].y0; if(gap>pitch*1.7){ const n=Math.min(2,Math.round(gap/pitch)-1); for(let k=0;k<n;k++) out.push(''); } }
      let str='';
      l.words.sort((a,b)=>a.x0-b.x0).forEach(w=>{
        let col=Math.round((w.x0-minX)/cw);
        if(str.length&&col<=str.length) col=str.length+1;
        str=str.padEnd(col,' ')+w.t;
      });
      out.push(str.replace(/\s+$/,''));
    });
    return out;
  }
  // Screenshots that overlap (scrolled a bit): drop the repeated lines
  function mergePages(pages){
    let acc=pages[0]||[];
    for(let i=1;i<pages.length;i++){
      const nxt=pages[i], A=acc.map(norm), B=nxt.map(norm); let cut=0, found=false;
      for(let k=Math.min(A.length,B.length,60);k>=3&&!found;k--){
        for(let s0=0;s0<=10&&s0+k<=B.length&&!found;s0++){
          let miss=0, real=0;
          for(let j=0;j<k;j++){ if(A[A.length-k+j]!==B[s0+j]) miss++; else if(B[s0+j]) real++; }
          if(real>=2&&miss<=(k>=6?1:0)){ cut=s0+k; found=true; }
        }
      }
      acc=acc.concat(found?nxt.slice(cut):nxt);
    }
    return acc;
  }
  async function prepImage(file){
    const bmp=await createImageBitmap(file);
    let sc=1; if(bmp.width>2200) sc=2200/bmp.width; else if(bmp.width<1100) sc=1100/bmp.width;
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    const x=c.getContext('2d',{willReadFrequently:true}); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height);
    const im=x.getImageData(0,0,c.width,c.height), d=im.data, n=c.width*c.height, g=new Uint8Array(n), hist=new Uint32Array(256);
    let sum=0;
    for(let i=0;i<n;i++){ const v=Math.round(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]); g[i]=v; hist[v]++; sum+=v; }
    const invert=(sum/n)<110;
    let lo=0,hi=255,acc2=0; for(let v=0;v<256;v++){ acc2+=hist[v]; if(acc2>n*0.02){lo=v;break;} }
    acc2=0; for(let v=255;v>=0;v--){ acc2+=hist[v]; if(acc2>n*0.02){hi=v;break;} }
    const span=Math.max(40,hi-lo);
    for(let i=0;i<n;i++){ let v=(g[i]-lo)*255/span; v=v<0?0:v>255?255:v; if(invert) v=255-v; d[i*4]=d[i*4+1]=d[i*4+2]=v; d[i*4+3]=255; }
    x.putImageData(im,0,0); return c;
  }
  function loadTess(){
    return new Promise((res,rej)=>{
      if(window.Tesseract) return res();
      const sc=document.createElement('script');
      sc.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js';
      sc.onload=()=>res(); sc.onerror=()=>rej(new Error('blocked'));
      document.head.append(sc);
    });
  }
  $('scanBtn').onclick=()=>$('scanFile').click();
  $('scanFile').onchange=async e=>{
    const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
    const st=$('scanStatus'), btn=$('scanBtn'); btn.disabled=true;
    let worker=null;
    try{
      st.textContent='Loading reader (first time needs internet)...';
      await loadTess();
      worker=await Tesseract.createWorker('eng',1,{logger:m=>{ if(m.status==='recognizing text') st.textContent='Reading photo '+cur_i+' of '+files.length+'... '+Math.round(m.progress*100)+'%'; else if(m.status&&/load|init/.test(m.status)) st.textContent='Loading reader (first time needs internet)...'; }});
      await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1',user_defined_dpi:'300'});
      var cur_i=0; const pages=[];
      for(const f of files){
        cur_i++; st.textContent='Reading photo '+cur_i+' of '+files.length+'...';
        const cv=await prepImage(f);
        const r=await worker.recognize(cv);
        pages.push(layoutLines(r.data.lines||[]));
      }
      const lines=mergePages(pages);
      const text=lines.join('\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+|\n+$/g,'');
      if(!text.trim()){ st.textContent='No text found. Try a clearer or closer photo.'; }
      else{
        const t=$('text'), old=t.value.replace(/\s+$/,'');
        t.value=old?old+'\n\n'+text:text;
        t.dispatchEvent(new Event('input'));
        st.textContent='Done. Check the text below and fix any mistakes, then tap Done.';
      }
    }catch(err){
      st.textContent=(err&&err.message==='blocked')
        ?'Scanning needs internet and only works in the downloaded HTML file, not in the Claude preview.'
        :'Could not read that photo. Try a clearer one.';
    }finally{
      btn.disabled=false; try{ if(worker) await worker.terminate(); }catch(_){}
    }
  };

    catch(e){ $('mHint').textContent='That does not look like a valid backup.'; }
  }
  $('restore').onclick=()=>modal({title:'Restore',hint:'Choose your backup file, or paste the backup text. Restoring replaces everything currently saved.',text:'',showText:true,
    extra:[['📂 Choose backup file',()=>$('restoreFile').click()]],action:'Restore',fn:doRestore});
  $('restoreFile').onchange=e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ $('mText').value=String(r.result||''); $('mText').style.display=''; $('mHint').textContent='File loaded: '+f.name+'. Tap Restore to replace your current songs with it.'; };
    r.onerror=()=>{ $('mHint').textContent='Could not read that file.'; };
    r.readAsText(f);
  };

  /* ---------- remember exactly where you were (survives closing the app) ---------- */
  function scrollKey(){ const c=cur(); return curGig().id+'|'+(S.view==='set'?(c?c.set.id:''):S.cur); }
  function rememberScroll(){
    if(editing) return;
    S.scrollKey=scrollKey();
    S.scrollTopR=stage.scrollHeight?stage.scrollTop/stage.scrollHeight:0;
    S.scrollLeftR=stage.scrollWidth?stage.scrollLeft/stage.scrollWidth:0;
    save();
  }
  let remT=0;
  stage.addEventListener('scroll',()=>{ clearTimeout(remT); remT=setTimeout(rememberScroll,250); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ rememberScroll(); } });
  window.addEventListener('pagehide',rememberScroll);
  function restoreScroll(){
    if(editing||S.scrollKey!==scrollKey()||!stage.clientHeight) return;
    stage.scrollTop=(S.scrollTopR||0)*stage.scrollHeight;
    stage.scrollLeft=(S.scrollLeftR||0)*stage.scrollWidth;
    pos=stage.scrollTop; lastSet=pos;
  }

  ensureCur(); renderAll(); setEdit(!!S.editing,true);
  restoreScroll();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(!stage.dataset.moved){ fitIfAuto(); restoreScroll(); } });
  stage.addEventListener('touchstart',()=>{ stage.dataset.moved=1; },{once:true,passive:true});
  stage.addEventListener('wheel',()=>{ stage.dataset.moved=1; },{once:true,passive:true});
})();
</script>
</body>
</html>
